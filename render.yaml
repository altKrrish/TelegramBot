services:
  - type: web
    name: tds-data-analyst-bot
    runtime: docker
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: MODEL
        value: google/gemini-2.5-flash
